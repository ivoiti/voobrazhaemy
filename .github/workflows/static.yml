# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # ⚠️ НЕ ПЫТАТЬСЯ поднять здесь `timeout` — проверено 06.08.2026.
        # Шаг ждёт публикацию Pages максимум 10 минут и падает с
        # «Timeout reached, aborting!», отменяя при этом исправный деплой.
        # Любое значение больше 600000 GitHub молча срезает обратно:
        # «Warning: timeout value is greater than the allowed maximum».
        # Лечение — не здесь: либо `python tools/deploy.py` (сам перевыкладывает
        # пустым коммитом), либо перевод Pages на прямой деплой из ветки
        # (`gh api -X PUT repos/ivoiti/voobrazhaemy/pages -f build_type=legacy`),
        # тогда Actions из цепочки уходит совсем. Подробности — «_Журнал ветки САЙТ.md».
